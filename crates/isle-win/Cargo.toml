[package]
name = "isle-win"
description = "Isle for Windows: a native notch-style island"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
isle-logic = { path = "../isle-logic" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_UI_Shell", "Foundation_Numerics", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_System_Power", "Media_Control", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Win32_Networking_WinHttp", "Win32_Media_Audio", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Foundation_Collections", "Win32_UI_Input_Ime", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi"] }
windows-numerics = "0.3"
windows-core = "0.62"
